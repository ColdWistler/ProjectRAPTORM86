[package]
name = "flight_core"
version.workspace = true
edition.workspace = true

[dependencies]
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
toml = "0.8"
# Required (not optional) since the RL weather system (`weather.rs`) uses the
# seeded PRNG for reproducible turbulence/scene sampling. The avionics
# features that previously enabled them now reference them implicitly (they
# are always available).
rand = "0.8"
rand_distr = "0.4"

[features]
default = ["full-avionics"]
imu = []
gps = []
baro = []
magnetometer = []
airspeed = []
servo = []
esc = []
battery = []
flight_controller = []
avionics-sensors = ["imu", "gps", "baro", "magnetometer", "airspeed"]
avionics-power = ["esc", "battery"]
full-avionics = ["avionics-sensors", "avionics-power", "servo", "flight_controller"]
