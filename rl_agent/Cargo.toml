[package]
name = "rl_agent"
version.workspace = true
edition.workspace = true

[dependencies]
flight_core = { path = "../flight_core" }
burn = { version = "0.21.0", features = [
    "std",
    "autodiff",
    "ndarray",
    "wgpu",
    "vulkan",
    "fusion",
] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "rl_agent"
path = "src/lib.rs"

[[bin]]
name = "rl_agent"
path = "src/main.rs"