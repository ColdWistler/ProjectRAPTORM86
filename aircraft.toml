# --- General / Mass properties (Cessna-172-like) ---
mass = 1100.0          # kg
wing_area = 16.2       # m^2 (wing planform area)
wing_span = 11.0       # m
chord = 1.47           # m (mean aerodynamic chord)

# --- Moments of inertia (kg*m^2) ---
ixx = 1300.0           # roll axis
iyy = 1900.0           # pitch axis
izz = 2700.0           # yaw axis

# --- Aerodynamic coefficients (linear model) ---
cl0 = 0.3              # lift coefficient at zero angle-of-attack
cla = 5.5              # lift curve slope (per radian)
cd0 = 0.025            # parasite (zero-lift) drag coefficient
k_drag = 0.04          # induced drag factor (k in CD = cd0 + k*CL^2)

cm0 = 0.0              # pitching moment coefficient at zero AoA
cma = -1.1             # pitch stability derivative (per radian), negative = nose-down restoring
cmq = -20.0            # pitch damping derivative (per rad/s)
cm_adot = -3.0         # alpha-dot pitch damping (downwash lag); negative = stabilizing
cme = -0.6             # elevator effectiveness (per radian), negative = trailing edge down pitches up

thrust_max = 1800.0    # max thrust in Newtons (Cessna-172-class engine)
power_max = 119000.0   # max engine shaft power in Watts (~160 hp)
thrust_arm = 0.0       # thrust-line offset from CG along body Z (m); positive = below CG

# --- Trailing-edge flap increments (per radian of flap deflection) ---
cl_flap = 1.10         # lift increment per rad (30 deg => +~0.57 dCL)
cd_flap = 0.14         # drag increment per rad (30 deg => +~0.073 dCD)
cm_flap = -0.20        # pitching moment per rad (negative = nose down)
flap_stall_shift = 6.0 # deg by which positive stall angle is reduced at full flap

# --- Steep-bank spiral nose-drop ---
# Nose-down pitching-moment coefficient engaged beyond ~45 deg bank, so a
# hand-off high bank falls into a dive instead of climbing with wings vertical.
spiral_nose_drop_cm = 0.10

# --- Collision-shape wind interaction ---
# Flat-plate panels the imposed wind pours onto. Each entry is a surface with
# an area (m^2), a body-frame unit normal [nx, ny, nz] (nose +X, up +Y, right
# +Z), a centre of pressure [x, y, z] offset from the CG in metres, and an
# optional flat-plate drag coefficient Cd (default 1.5). These make the shape
# respond to the wind: the nose catches headwinds, the fin crosswinds, etc.
[[collision_panels]]
area = 1.3              # fuselage frontal area -> catches headwind
normal = [1.0, 0.0, 0.0]
cp = [2.1, 0.0, 0.0]
cd = 1.8

[[collision_panels]]
area = 1.6              # vertical fin -> crosswind / sideslip yaw authority
normal = [0.0, 0.0, 1.0]
cp = [-1.9, 0.0, 0.6]

[[collision_panels]]
area = 4.5              # wing underside -> vertical gusts push the wing up
normal = [0.0, -1.0, 0.0]
cp = [0.3, 0.0, -0.1]
